name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: ledger (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ledger/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # NOTE: `npm run test:coverage` is intentionally NOT run here yet — the 85/80
      # thresholds currently fail (~65% lines) because untested infra adapters are in
      # the coverage scope. Re-enable as a blocking step once that gap is closed.

  treasury:
    name: treasury (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treasury
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: treasury/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  validators:
    name: validators (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: validators/go.mod
          cache-dependency-path: validators/go.sum
      - run: go build ./...
      - run: go test ./src/tests/...

  docker:
    name: ledger image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only (no push): catches Dockerfile regressions without needing a registry.
      - run: docker build -t ledger:ci ./ledger
